[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfeval"
version = "0.1.0"
description = "Multi-fidelity evaluation and test selection for an in-car LLM assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Karan Lodha" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]  # pulls in PyTorch
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mfeval = "mfeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
